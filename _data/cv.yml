        location: Richmond, Virginia, USA
        start_date: 2018-08
        end_date: 2026
        summary: Developed intelligent control, optimization, data analytics, and experimental infrastructure for a modular smart-city cyber-physical testbed.
        highlights:
          - Built learning and optimization pipelines for smart buildings, transportation, water, energy, and healthcare applications.
          - Developed bi-level, multi-objective, and reinforcement-learning components for interconnected infrastructure under operational constraints.
          - Integrated sensors, embedded hardware, middleware, data pipelines, dashboards, and closed-loop control systems.
          - Mentored more than 20 high-school, undergraduate, and graduate researchers.
          - Contributed to peer-reviewed publications, posters, demonstrations, and grant-related activities.

