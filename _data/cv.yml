  sections:
    Profile:
      - Electrical and computer engineer developing hierarchical, constraint-aware, and uncertainty-informed learning and control methods for complex cyber-physical systems. Research applications span smart buildings, intelligent transportation, EV charging, microgrids, energy systems, IoT, and smart healthcare, with an emphasis on end-to-end experimental validation.

    Research Interests:
      - label: Methods
        details: Hierarchical and safe reinforcement learning; bi-level and multi-objective optimization; model predictive control; probabilistic forecasting; anomaly detection
      - label: Systems
        details: Smart cities; cyber-physical systems; smart buildings; intelligent transportation; smart grids and microgrids; IoT and sensor networks
      - label: Practice
        details: Testbed design; sensing and embedded integration; data pipelines; closed-loop experimentation; reproducible research

